kind = "web"
previewPath = "/"
title = "Financial Stability Watch"
description = "Restricted internal financial-stability monitoring, using public news and historical indicators alongside the existing Dataminr First Alert connection."
version = "1.0.0"
id = "artifacts/media-cop"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20561

[services.development]
run = "pnpm --filter @workspace/media-cop run dev"

[services.production]
serve = "static"
publicDir = "artifacts/media-cop/dist/public"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/media-cop", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.env]
PORT = "20561"
BASE_PATH = "/"