kind = "web"
previewPath = "/"
title = "Media Common Operating Picture"
description = "Pilot Bravo — a real-time defense-news aggregation app for military leadership. Monitors, scrapes, and AI-categorizes defense-related news into a dense, Bloomberg-Terminal-style common operating picture, with a war dashboard, curated top-stories lane, and admin curation tools."
version = "1.0.0"
id = "artifacts/media-cop"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20561

[services.development]
run = "pnpm --filter @workspace/media-cop run dev"

[services.production]
serve = "static"
publicDir = "artifacts/media-cop/dist/public"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/media-cop", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.env]
PORT = "20561"
BASE_PATH = "/"